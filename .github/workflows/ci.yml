name: verify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configure isolated runtime paths
        shell: pwsh
        run: |
          "PANELOOM_APP_DATA_DIR=$env:RUNNER_TEMP\PaneloomCI" >> $env:GITHUB_ENV
          "PANELOOM_PROJECTS_HOME=$env:RUNNER_TEMP\PaneloomProjects" >> $env:GITHUB_ENV

      - name: Install Python verification environment
        run: |
          python -m pip install --upgrade pip==26.1.2
          python -m pip install -r requirements-lock.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify release SBOM and license inventory
        run: |
          python scripts/generate_release_metadata.py --node-modules frontend/node_modules
          git diff --exit-code -- THIRD_PARTY_LICENSES.md sbom/python-build.cdx.json sbom/python-runtime.cdx.json

      - name: Check repository hygiene
        run: python scripts/check_repository_hygiene.py

      - name: Lint Python
        run: python -m ruff check backend api desktop scripts tests

      - name: Compile Python
        run: python -m compileall backend api desktop scripts

      - name: Run automated workflows
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Check frontend and production build
        working-directory: frontend
        run: npm run check

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Audit Python runtime dependencies
        run: python -m pip_audit -r backend/requirements.txt --progress-spinner off

      - name: Validate production runtime without a dev server
        run: python -m desktop.launcher --runtime-smoke --no-single-instance
