name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PANELOOM_APP_DATA_DIR: ${{ runner.temp }}\PaneloomCI

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python verification environment
        run: |
          python -m pip install --upgrade pip==26.1.2
          python -m pip install -r requirements-dev.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check repository hygiene
        run: python scripts/check_repository_hygiene.py

      - name: Lint Python
        run: python -m ruff check backend api desktop scripts tests

      - name: Compile Python
        run: python -m compileall backend api desktop scripts

      - name: Run automated workflows
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Check frontend and production build
        working-directory: frontend
        run: npm run check

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Audit Python runtime dependencies
        run: python -m pip_audit -r backend/requirements.txt --progress-spinner off

      - name: Validate production runtime without a dev server
        run: python -m desktop.launcher --runtime-smoke --no-single-instance
